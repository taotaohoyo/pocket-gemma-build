name: Probe Tavily sign-in error (thread hxxptq)
# Why Fielua's Tavily sign-in shows "We couldn't finish setting up your
# Tavily account" at mcp.tavily.com (2026-11-13). No account, key or secret
# is used; the log is public.
on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-hxxptq]
    paths: ['tools/tavily-signin-probe/**', '.github/workflows/tavily-signin-probe.yml']
permissions:
  contents: read
concurrency:
  group: tavily-signin-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I tools/tavily-signin-probe/probe.py
