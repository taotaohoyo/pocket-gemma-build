name: Phi-4-mini-reasoning thinking budget on an Arm CPU
# On the phone's CPU, 1.1.0 (205)'s 1,536-token thinking budget meant minutes
# before Phi's first word. Each budget's thinking time, answers and their
# language, with the app's chat setup and the official LiteRT-LM 0.18.0.
# A push of this file starts it once (a workflow only on a branch can't be
# dispatched until it has run).
on:
  push:
    branches: [claude/project-thread-i1yx09]
    paths: ['.github/workflows/phi-budget.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  budget:
    strategy:
      fail-fast: false
      matrix:
        budget: [512, 768, 1024, 1536]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install litert-lm-api==0.18.0
      - name: Download and check
        run: |
          mkdir -p "$RUNNER_TEMP/work" && cd "$RUNNER_TEMP/work"
          curl -fsSL --retry 3 -o model.litertlm "https://huggingface.co/litert-community/Phi-4-mini-reasoning/resolve/cbcc9be3bd879651abbb2330be0943c19d037122/model.litertlm?download=true"
          echo "d507262ca3d01d93d59c573a82e6f2eeb3aec21d9a67c31fb4c0f93d17225b8f  model.litertlm" | shasum -a 256 -c
      - name: Questions with this budget
        working-directory: ${{ runner.temp }}/work
        run: python3 "$GITHUB_WORKSPACE/tools/inspect-new-models/phi_budget.py" model.litertlm ${{ matrix.budget }}
