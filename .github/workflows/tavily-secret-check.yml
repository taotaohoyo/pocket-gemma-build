name: Check which secrets the live search probes can see
# A one-off check for thread 30lqar: prints the names (never the values) of
# the secrets an Actions job on this branch can read, to find why
# secrets.TAVILY_API_KEY came through empty. Removed once answered.
on:
  push:
    branches: [claude/project-thread-30lqar]
    paths: ['.github/workflows/tavily-secret-check.yml']
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Print secret names only
        env:
          VISIBLE: ${{ toJSON(secrets) }}
          WANTED: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          names = sorted(name for name in json.loads(os.environ['VISIBLE']) if name.lower() != 'github_token')
          print('SECRET_NAMES', len(names), names)
          print('SECRET_TAVILY_LIKE', [name for name in names if 'TAV' in name.upper() or 'TVLY' in name.upper()])
          wanted = os.environ.get('WANTED', '')
          print('SECRET_TAVILY_API_KEY', 'set' if wanted else 'empty', 'length', len(wanted), 'starts tvly-' if wanted.startswith('tvly-') else '')
          PY
