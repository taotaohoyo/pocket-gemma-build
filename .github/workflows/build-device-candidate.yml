name: Build device IPA independently of simulator inference
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Newer rebuild-ios-runtime run to try; empty uses the runtime pinned in .github/native-runtime/release.json
        required: false
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: pocket-gemma-device-candidate
  cancel-in-progress: false
jobs:
  device-ipa:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - run: unzip -o NativeRuntime-source.zip
      - name: Fetch the pinned native runtime, or the given rebuild run's
        uses: ./.github/native-runtime
        with:
          run-id: ${{ inputs.native_run_id }}
      - name: Verify six binaries and configure app
        run: |
          python3 NativeRuntime/native_artifact.py zip build/native-artifact/PocketGemma-NativeRuntime.zip
          python3 NativeRuntime/configure-app.py build/native-artifact/PocketGemma-NativeRuntime.zip
      - run: brew install xcodegen
      - name: Build and validate device Release IPA
        timeout-minutes: 22
        run: |
          set -euo pipefail
          bash scripts/build-ios.sh 2>&1 | tee build/device-ipa-build.log
          mkdir -p build/device-candidate
          cp build/PocketGemma-unsigned.ipa build/device-candidate/PocketGemma-1.1.0-270.ipa
          cp build/DerivedData/Build/Products/Release-iphoneos/PocketGemma.app/runtime-build.json build/device-candidate/runtime-build-device.json
          # The microphone's words (1.1.0 (236)): without them iOS ends the app
          # when it records; each language's from InfoPlist.xcstrings.
          app=build/DerivedData/Build/Products/Release-iphoneos/PocketGemma.app
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist"
          for lang in en ja ko zh-Hans zh-Hant; do
            plutil -p "$app/$lang.lproj/InfoPlist.strings" 2>/dev/null | grep NSMicrophoneUsageDescription || echo "MIC-TEXT missing in $lang"
          done
          # PCと接続 (1.1.0 (253)): the camera's and the local network's words,
          # the Bonjour service and ATS's local networking.
          for key in NSCameraUsageDescription NSLocalNetworkUsageDescription NSBonjourServices NSAppTransportSecurity; do
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" || echo "PC-LINK-PLIST missing $key"
          done
          for lang in en ja ko zh-Hans zh-Hant; do
            plutil -p "$app/$lang.lproj/InfoPlist.strings" 2>/dev/null | grep -c 'NSCameraUsageDescription\|NSLocalNetworkUsageDescription' || echo "PC-LINK-TEXT missing in $lang"
          done
          # Claude (1.1.0 (262)): Face ID's words, before the developer manages
          # the relay with the Secure Enclave key; without them iOS refuses Face ID.
          /usr/libexec/PlistBuddy -c 'Print :NSFaceIDUsageDescription' "$app/Info.plist" || echo "FACEID-PLIST missing"
          for lang in en ja ko zh-Hans zh-Hant; do
            plutil -p "$app/$lang.lproj/InfoPlist.strings" 2>/dev/null | grep NSFaceIDUsageDescription || echo "FACEID-TEXT missing in $lang"
          done
          # The app icon (1.1.0 (267): AppIcon.appiconset, look A as a picture)
          # compiled into the catalog and named by Info.plist; the small
          # rendition into the log (ICON_IMG lines) to look at.
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$app/Info.plist" || echo "APP-ICON-PLIST missing"
          xcrun assetutil --info "$app/Assets.car" | python3 -c "import json,sys; a=json.load(sys.stdin); print('APP-ICON-CAR', sorted({(str(x.get('AssetType')), str(x.get('Name'))) for x in a[1:] if 'AppIcon' in str(x.get('Name', ''))}))" || echo "APP-ICON-CAR unreadable"
          ls "$app" | grep -i appicon || echo "APP-ICON-FILES none"
          if [ -f "$app/AppIcon60x60@2x.png" ]; then base64 -i "$app/AppIcon60x60@2x.png" | tr -d '\n' | fold -w 8000 | awk '{print "ICON_IMG app-icon-60x2", NR-1, $0}'; fi
          # 1.1.0 (251): the app's folders are not shared with the Files app
          # (no UIFileSharingEnabled / LSSupportsOpeningDocumentsInPlace).
          python3 - "$app/Info.plist" <<'PY'
          import plistlib, sys
          info = plistlib.load(open(sys.argv[1], 'rb'))
          shared = {key: info.get(key) for key in ('UIFileSharingEnabled', 'LSSupportsOpeningDocumentsInPlace', 'UISupportsDocumentBrowser')}
          print('FILES-APP-ACCESS', shared)
          assert not any(shared.values()), 'the app folder would show in the Files app'
          PY
          python3 - <<'PY'
          import hashlib,json,pathlib
          root=pathlib.Path('build/device-candidate'); ipa=root/'PocketGemma-1.1.0-270.ipa'
          (root/(ipa.name+'.sha256')).write_text(hashlib.sha256(ipa.read_bytes()).hexdigest()+'  '+ipa.name+'\n')
          result={'candidate':'1.1.0 (270)','minimumIOS':'26.4','ipaBuild':'passed','ipaStructure':'passed',
              'priorCandidateSimulatorInference':{'candidate':'1.0.15 (16)','run':38638840490,'passed':4,'failed':12,'skipped':0,
                  'failure':'Apple none-mode RuntimeProxy null builtin; source fix now imports provider C entry point'},
              'currentCandidateSimulatorInference':'recorded separately; a successful IPA build is not an inference result',
              'physicalIPhoneInference':'new UI candidate unverified; E2B baseline1.0.18 confirmed by user','E4BVision':'chat photos at 70 image tokens; phone check pending','stableAltStoreVersion':'1.0.14','stableAltStoreChanged':False}
          (root/'candidate-validation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - name: Save device IPA separately from semantic test status
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-1.1.0-270-Device-Candidate
          path: build/device-candidate
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Preserve build logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-Device-IPA-Build-Log
          path: build/device-ipa-build.log
          if-no-files-found: ignore
          retention-days: 7
