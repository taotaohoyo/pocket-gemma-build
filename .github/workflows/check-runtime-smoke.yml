name: Check runtime initialization with bounded SDK smoke
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Newer rebuild-ios-runtime run to try; empty uses the runtime pinned in .github/native-runtime/release.json
        required: false
        default: ''
      probe:
        description: Explicit bounded probe; use images only after text smoke passes
        type: choice
        options:
          - ui-ux-regression
          - text
          - long-reply
          - open-turn
          - chart-reply
          - chart-talk
          - chart-recall
          - chart-sheet
          - chart-final
          - chart-placeholder
          - qwen-text
          - qwen-files
          - qwen-gpu
          - files
          - video
          - audio-e2b
          - audio-e4b
          - video-audio-e2b
          - video-long-e2b
          - video-audio-e4b
          - e4b-photos
          - e4b-deep
          - e4b-fast
          - web-search
          - text-and-images-xnnpack
          - images-xnnpack
          - images-builtin
          - reply-language-e2b
          - reply-language-e4b-current
          - reply-language-e4b-app
          - reply-language-e4b-app-rest
          - feature-language-e2b
          - long-reply-language
          - feature-language-e4b-search
          - feature-language-e4b-continuation
          - feature-language-e4b-chart
          - gemma12b-text
          - phi-text
          - qwen35-text
          - qwen35-trace
          - phi-trace
          - cpu-compare
          - gpu-new-models
          - memory-new-models
          - lock-new-models
          - qwen35-thinking
          - search-note-e2b
          - search-note-e4b
          - search-focus-e2b
          - search-focus-e4b
          - search-focus-e4b-more
          - search-live-e2b
          - search-live-e2b-more
          - search-live-e4b
          - search-live-e4b-more
          - search-live-e4b-rest
          - search-live-e2b-hidden
          - search-live-e4b-hidden
          - search-recorded-e2b
          - search-recorded-e4b
        default: ui-ux-regression
permissions:
  contents: read
  actions: read
jobs:
  sdk-smoke:
    runs-on: macos-26
    # The measured text run needed ~13 minutes for Simulator/build/model setup.
    # Allow the existing 10-minute image watchdog to finish and upload evidence.
    # This changes no inference timeout and starts no full image suite.
    # chart-reply runs five real replies (E2B and E4B on CPU) after that setup.
    # chart-talk, chart-recall, chart-sheet, chart-final and chart-placeholder run E2B chats of up to four turns (30 minutes).
    # qwen-text, qwen-files, qwen-gpu, files, e4b-photos, e4b-deep, e4b-fast, web-search and open-turn give their probe
    # the watchdog's maximum, 30 minutes; every probe is still bounded by its
    # own watchdog limit. The reply-language probes give their replies at most 1500 seconds
    # of the watchdog's 1800 (sixteen short replies per system message), as do the
    # feature-language probes (web search, continuation and chart notes, 1.1.0 (195)).
    # gemma12b-text downloads the 6.88 GB 12B file and gives its one CPU
    # check at most 1500 seconds of the watchdog's 1800.
    # phi-text (one reasoning reply on the CPU) and qwen35-text (a Japanese chat and
    # the clean-start check, CPU) download their own 2.8 GB file, 1.1.0 (205).
    # qwen35-trace and phi-trace print the runtime's own stream chunk by chunk
    # (default and 32-bit activations), after 205 showed only 「考えています…」.
    # cpu-compare asks Qwen3 0.6B, E2B and Qwen3.5 the same question on the CPU
    # with the process's CPU time and pages read (arm-new-models.yml runs the
    # official macOS build the same way). gpu-new-models asks Qwen3.5 and Phi the
    # same on the GPU (Metal), memory-new-models on the CPU with the weights in
    # the process's memory (cache ":memory", not built into the iOS runtime),
    # lock-new-models with the mapped weight cache locked in memory (206's fix).
    # search-focus-* (1.1.0 (208)) give their version cases at most 1250 seconds of the 1500.
    # search-live-* (1.1.0 (211)) search Tavily for real through a relay on 127.0.0.1 that alone
    # has the TAVILY_API_KEY secret, and give their cases at most 1250 seconds of the 1500.
    # search-recorded-* (1.1.0 (211)) put the ChatGPT cases to the real model over the pages
    # Tavily found on 2026-10-27, kept in the test, for runs without the secret.
    timeout-minutes: 65
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - run: unzip -o NativeVision-source.zip
      - run: unzip -o NativeRuntime-source.zip
      - name: Test core diagnostics, history and animation policies
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p build/NativeVision
          swift test --package-path Packages/PocketCore 2>&1 | tee build/NativeVision/core-tests.log
      - name: Fetch the pinned native runtime, or the given rebuild run's
        uses: ./.github/native-runtime
        with:
          run-id: ${{ inputs.native_run_id }}
      - run: python3 NativeRuntime/native_artifact.py zip build/native-artifact/PocketGemma-NativeRuntime.zip
      - run: python3 NativeRuntime/configure-app.py build/native-artifact/PocketGemma-NativeRuntime.zip
      - run: brew install xcodegen
      - name: Verify watchdog and shell syntax
        timeout-minutes: 2
        run: |
          python3 scripts/test-native-watchdog.py
          bash -n scripts/check-native-vision.sh
      # Only the relay gets the key; the probe step and the test process
      # don't, and nothing it writes holds it.
      - name: Start the local Tavily relay for the live search probes
        if: startsWith(inputs.probe, 'search-live')
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          mkdir -p build/NativeVision
          if [[ -z "$TAVILY_API_KEY" ]]; then
            echo "TAVILY_LIVE_RELAY none: no TAVILY_API_KEY secret, the live cases skip"
            exit 0
          fi
          nohup python3 scripts/tavily-relay.py build/NativeVision/tavily-live.jsonl > /dev/null 2>&1 &
          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8765/health > /dev/null; then echo "TAVILY_LIVE_RELAY up"; exit 0; fi
            sleep 0.5
          done
          echo "TAVILY_LIVE_RELAY did not start"
          exit 1
      - name: Bounded native SDK probe
        env:
          NATIVE_SMOKE_ONLY: '1'
          NATIVE_PROBE: ${{ inputs.probe }}
        run: bash scripts/check-native-vision.sh
      - name: Print the live searches and keep the key out of the evidence
        if: always() && startsWith(inputs.probe, 'search-live')
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 scripts/tavily-relay.py --print build/NativeVision/tavily-live.jsonl || true
          if [[ -n "$TAVILY_API_KEY" && -d build/NativeVision ]]; then
            found=$(grep -rlF -- "$TAVILY_API_KEY" build/NativeVision || true)
            if [[ -n "$found" ]]; then
              printf '%s\n' "$found" | while read -r file; do rm -rf -- "$file"; done
              echo "TAVILY_LIVE removed $(printf '%s\n' "$found" | wc -l) file(s) that held the key"
            else
              echo "TAVILY_LIVE no file holds the key"
            fi
          fi
      - name: Preserve activity, fatal native messages and crash reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-Bounded-SDK-Smoke
          path: |
            build/NativeVision/*.json
            build/NativeVision/*.jsonl
            build/NativeVision/*.log
            build/NativeVision/*.stack.txt
          retention-days: 7
