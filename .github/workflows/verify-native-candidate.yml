name: Verify patched iOS vision and build IPA
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: Successful pinned native LM rebuild run ID
        required: true
      reuse_core_run:
        description: Optional prior core-ui run; exact app and validator sources must match
        required: false
      publish_candidate:
        description: Publish a separate prerelease after every validation passes
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: pocket-gemma-vision-candidate
  cancel-in-progress: false
jobs:
  core-ui:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - run: unzip -o NativeRuntime-source.zip
      - name: Verify prior core and UI evidence against identical inputs
        if: ${{ inputs.reuse_core_run != '' }}
        env:
          REUSE_CORE_RUN: ${{ inputs.reuse_core_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, io, json, os, pathlib, urllib.request, zipfile
          run=os.environ['REUSE_CORE_RUN']
          assert run.isdecimal(), 'Run ID must be numeric'
          base='https://api.github.com/repos/taotaohoyo/pocket-gemma-build/'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'PocketGemma-core-evidence'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read()
          prior=json.loads(get(base+'actions/runs/'+run))
          assert prior['path']=='.github/workflows/verify-native-candidate.yml'
          jobs=json.loads(get(base+'actions/runs/'+run+'/jobs'))['jobs']
          core=[j for j in jobs if j['name']=='core-ui']
          assert len(core)==1 and core[0]['conclusion']=='success', 'Prior core/UI job did not pass'
          raw='https://raw.githubusercontent.com/taotaohoyo/pocket-gemma-build/'+prior['head_sha']+'/'
          old_app=get(raw+'PocketGemma-source.zip')
          assert hashlib.sha256(old_app).digest()==hashlib.sha256(pathlib.Path('PocketGemma-source.zip').read_bytes()).digest(), 'App/preview/core input changed; rerun UI'
          old_native=get(raw+'NativeRuntime-source.zip')
          with zipfile.ZipFile(io.BytesIO(old_native)) as old, zipfile.ZipFile('NativeRuntime-source.zip') as new:
              for name in ['NativeRuntime/native_artifact.py','NativeRuntime/test_native_artifact.py','NativeRuntime/upstream-lock.json']:
                  assert old.read(name)==new.read(name), 'Native validator input changed; rerun checks'
          print('Reused completed core/UI evidence:',run,core[0]['html_url'])
          print('Identical app ZIP SHA256:',hashlib.sha256(old_app).hexdigest())
          PY
      - run: brew install xcodegen
        if: ${{ inputs.reuse_core_run == '' }}
      - name: Core settings, privacy, cache and history regression tests
        if: ${{ inputs.reuse_core_run == '' }}
        run: swift test --package-path Packages/PocketCore
      - name: IPA package integrity regression tests
        if: ${{ inputs.reuse_core_run == '' }}
        run: python3 scripts/test-ipa-check.py
      - name: Native packaging and failure-propagation regression tests
        if: ${{ inputs.reuse_core_run == '' }}
        run: python3 NativeRuntime/test_native_artifact.py
      - name: UI and animation regression tests
        if: ${{ inputs.reuse_core_run == '' }}
        run: bash scripts/check-ui.sh
      - name: Preserve UI evidence
        if: ${{ always() && inputs.reuse_core_run == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-Candidate-UI
          path: build/UI
          retention-days: 3
  native-and-ipa:
    needs: core-ui
    runs-on: macos-26
    timeout-minutes: 110
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - run: unzip -o NativeVision-source.zip
      - run: unzip -o NativeRuntime-source.zip
      - name: Wait for the selected native build to finish
        env:
          NATIVE_RUNTIME_RUN: ${{ inputs.native_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          run=os.environ['NATIVE_RUNTIME_RUN']
          assert run.isdecimal(), 'Run ID must be numeric'
          url=f'https://api.github.com/repos/taotaohoyo/pocket-gemma-build/actions/runs/{run}'
          for _ in range(45):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'PocketGemma-native-verification'})
              with urllib.request.urlopen(req,timeout=30) as r: result=json.load(r)
              assert result['path']=='.github/workflows/rebuild-ios-runtime.yml', 'Wrong native workflow'
              print('Native rebuild:',result['status'],result['conclusion'],flush=True)
              if result['status']=='completed':
                  assert result['conclusion']=='success', 'Native build failed; do not create an IPA'
                  artifacts_url=f'https://api.github.com/repos/taotaohoyo/pocket-gemma-build/actions/runs/{run}/artifacts'
                  req=urllib.request.Request(artifacts_url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'PocketGemma-native-verification'})
                  with urllib.request.urlopen(req,timeout=30) as r: artifacts=json.load(r)['artifacts']
                  actual=[a for a in artifacts if a['name']=='PocketGemma-Rebuilt-NativeRuntime' and not a['expired']]
                  assert len(actual)==1 and actual[0]['size_in_bytes']>100000, 'Native runtime artifact missing or log-only'
                  break
              time.sleep(60)
          else: raise SystemExit('Native build not finished; do not create an IPA')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: PocketGemma-Rebuilt-NativeRuntime
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          path: build/native-artifact
      - name: Verify native artifact and prepare local Swift package
        run: |
          python3 NativeRuntime/native_artifact.py zip build/native-artifact/PocketGemma-NativeRuntime.zip
          python3 NativeRuntime/configure-app.py build/native-artifact/PocketGemma-NativeRuntime.zip
      - run: brew install xcodegen
      - name: Real E2B and E4B JPEG, text, recovery and memory tests
        run: bash scripts/check-native-vision.sh
      - name: Build unsigned Release IPA only after inference tests pass
        run: bash scripts/build-ios.sh
      - name: Preserve native inference evidence without model weights
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-Candidate-Native-Evidence
          path: |
            build/NativeVision/*.json
            build/NativeVision/*.log
          retention-days: 3
      - name: Preserve verified Release IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-Candidate-AltStore
          path: build/PocketGemma-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
  publish-candidate:
    if: ${{ inputs.publish_candidate }}
    needs: native-and-ipa
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - run: unzip -o NativeRuntime-source.zip
      - uses: actions/download-artifact@v4
        with:
          name: PocketGemma-Candidate-AltStore
          path: build/candidate
      - uses: actions/download-artifact@v4
        with:
          name: PocketGemma-Candidate-Native-Evidence
          path: build/candidate/evidence
      - uses: actions/download-artifact@v4
        with:
          name: PocketGemma-Rebuilt-NativeRuntime
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
          path: build/candidate/native
      - name: Recheck IPA and publish a separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-ipa.py build/candidate/PocketGemma-unsigned.ipa
          python3 NativeRuntime/native_artifact.py zip build/candidate/native/PocketGemma-NativeRuntime.zip
          cp build/candidate/PocketGemma-unsigned.ipa build/candidate/PocketGemma-1.0.15.ipa
          (cd build/candidate && sha256sum PocketGemma-1.0.15.ipa > PocketGemma-1.0.15.ipa.sha256)
          gh release create v1.0.15-rc.1 build/candidate/PocketGemma-1.0.15.ipa build/candidate/PocketGemma-1.0.15.ipa.sha256 \
            build/candidate/evidence/summary.json build/candidate/evidence/runtime-build.json \
            build/candidate/evidence/memory-stability.json \
            build/candidate/evidence/configuration-matrix.json build/candidate/evidence/isolated-probes.json \
            build/candidate/native/PocketGemma-NativeRuntime.zip \
            --target "$GITHUB_SHA" --title 'Pocket Gemma 1.0.15 RC1 — 画像推論の修正候補' \
            --notes-file docs/UPDATE-1.0.15-RC.md --prerelease
