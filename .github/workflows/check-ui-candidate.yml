name: Check candidate chat UX and attachment safety
on:
  workflow_dispatch:
    inputs:
      scope:
        description: Focused suite, accessibility guide or isolated scroll layout regression
        type: choice
        default: focused
        options: [focused, access-guide, scroll-layout, bottom-follow, plus-motion, send-motion, jump-motion, history, island, markdown, charts, chart-reading, files, probe, orb, orb-video, composer, composer-lab, menu-video, jump-tuck, app-name, settings-open, web-search, cellular-download, composer-type, keyboard-preview, text-size, settings-ui, settings-regression, settings-perf, watch, first-launch, wording, tidy, core]
permissions:
  contents: read
jobs:
  ui-check:
    runs-on: macos-26
    timeout-minutes: 36
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - run: unzip -o PocketGemma-source.zip
      - name: Verify core attachment, history and motion policies
        timeout-minutes: 6
        run: |
          set -euo pipefail
          mkdir -p build/UI
          swift test --package-path Packages/PocketCore 2>&1 | tee build/UI/core.log
      - if: inputs.scope != 'core'
        run: brew install xcodegen
      - name: Test focused native UI interactions
        if: inputs.scope != 'core'
        # Separate boot480s, compile420s and tests600s watchdogs plus cleanup.
        # The previous19-minute step could kill tests before their own bound.
        # The composer scope (eighteen cases) needs up to about 19 minutes.
        timeout-minutes: 32
        env:
          UI_FOCUSED_ONLY: '1'
          UI_AX_GUIDE_ONLY: ${{ inputs.scope == 'access-guide' && '1' || '0' }}
          UI_SCROLL_LAYOUT_ONLY: ${{ inputs.scope == 'scroll-layout' && '1' || '0' }}
          UI_BOTTOM_ONLY: ${{ inputs.scope == 'bottom-follow' && '1' || '0' }}
          UI_PLUS_ONLY: ${{ inputs.scope == 'plus-motion' && '1' || '0' }}
          UI_SEND_ONLY: ${{ inputs.scope == 'send-motion' && '1' || '0' }}
          UI_JUMP_ONLY: ${{ inputs.scope == 'jump-motion' && '1' || '0' }}
          UI_HISTORY_ONLY: ${{ inputs.scope == 'history' && '1' || '0' }}
          UI_ISLAND_ONLY: ${{ inputs.scope == 'island' && '1' || '0' }}
          UI_MARKDOWN_ONLY: ${{ inputs.scope == 'markdown' && '1' || '0' }}
          UI_CHARTS_ONLY: ${{ inputs.scope == 'charts' && '1' || '0' }}
          UI_CHART_READING_ONLY: ${{ inputs.scope == 'chart-reading' && '1' || '0' }}
          UI_FILES_ONLY: ${{ inputs.scope == 'files' && '1' || '0' }}
          UI_PROBE_ONLY: ${{ inputs.scope == 'probe' && '1' || '0' }}
          UI_ORB_ONLY: ${{ inputs.scope == 'orb' && '1' || '0' }}
          UI_ORB_VIDEO_ONLY: ${{ inputs.scope == 'orb-video' && '1' || '0' }}
          UI_COMPOSER_ONLY: ${{ inputs.scope == 'composer' && '1' || '0' }}
          UI_COMPOSER_LAB_ONLY: ${{ inputs.scope == 'composer-lab' && '1' || '0' }}
          UI_MENU_VIDEO_ONLY: ${{ inputs.scope == 'menu-video' && '1' || '0' }}
          UI_JUMP_TUCK_ONLY: ${{ inputs.scope == 'jump-tuck' && '1' || '0' }}
          UI_APP_NAME_ONLY: ${{ inputs.scope == 'app-name' && '1' || '0' }}
          UI_SETTINGS_OPEN_ONLY: ${{ inputs.scope == 'settings-open' && '1' || '0' }}
          UI_WEB_SEARCH_ONLY: ${{ inputs.scope == 'web-search' && '1' || '0' }}
          UI_CELLULAR_DOWNLOAD_ONLY: ${{ inputs.scope == 'cellular-download' && '1' || '0' }}
          UI_COMPOSER_TYPE_ONLY: ${{ inputs.scope == 'composer-type' && '1' || '0' }}
          UI_KEYBOARD_PREVIEW_ONLY: ${{ inputs.scope == 'keyboard-preview' && '1' || '0' }}
          UI_TEXT_SIZE_ONLY: ${{ inputs.scope == 'text-size' && '1' || '0' }}
          UI_SETTINGS_UI_ONLY: ${{ inputs.scope == 'settings-ui' && '1' || '0' }}
          UI_SETTINGS_REGRESSION_ONLY: ${{ inputs.scope == 'settings-regression' && '1' || '0' }}
          UI_SETTINGS_PERF_ONLY: ${{ inputs.scope == 'settings-perf' && '1' || '0' }}
          UI_WATCH_ONLY: ${{ inputs.scope == 'watch' && '1' || '0' }}
          UI_FIRST_LAUNCH_ONLY: ${{ inputs.scope == 'first-launch' && '1' || '0' }}
          UI_WORDING_ONLY: ${{ inputs.scope == 'wording' && '1' || '0' }}
          UI_TIDY_ONLY: ${{ inputs.scope == 'tidy' && '1' || '0' }}
        run: |
          set -euo pipefail
          bash scripts/check-ui.sh 2>&1 | tee build/UI/uitests.log
      - name: Preserve UI results, screenshots and recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-UIUX-Candidate-Checks
          path: |
            build/UI/*.log
            build/UI/*.json
            build/UI/*.jsonl
            build/UI/*.stack.txt
            build/UI/*.png
            build/UI/*.mp4
            build/UI/attachments
            build/UI/Preview.xcresult
          retention-days: 7
          if-no-files-found: error
      - name: Preserve the interaction recording on its own
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-UI-Recording
          path: |
            build/UI/interaction.mp4
            build/UI/focused-tests.log
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
      - name: Preserve motion frame strips on their own
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-UI-Strips
          path: build/UI/strips
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve small review logs separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PocketGemma-UI-ReviewLogs
          path: |
            build/UI/focused-tests.log
            build/UI/compile.log
            build/UI/boot.log
            build/UI/core.log
            build/UI/*.json
            build/UI/*.jsonl
            build/UI/failure.png
            build/UI/attachments/manifest.json
          retention-days: 7
          if-no-files-found: ignore
