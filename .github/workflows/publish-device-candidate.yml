name: Publish device candidate as a GitHub release
# Runs once when this file is pushed. Attaches an already-built, unchanged
# device IPA artifact to a release so altstore-source.json can point at it.
on:
  push:
    branches: [claude/plus-liquid-glass]
    paths: [.github/workflows/publish-device-candidate.yml]
permissions:
  contents: write
  actions: read
env:
  BUILD_RUN: '38990529200'
  ARTIFACT: PocketGemma-1.0.23-Device-Candidate
  TAG: v1.0.23
  TARGET: e79d03cae6385e77f9550e864bcca921fa3eb336
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: candidate
      - name: Verify the IPA against its recorded checksum
        run: |
          set -euo pipefail
          cd candidate
          ls -l
          sha256sum -c PocketGemma-1.0.23.ipa.sha256
          stat -c 'IPA_BYTES=%s' PocketGemma-1.0.23.ipa
      - name: Create the release with the IPA attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ＋ボタンをSwiftUI標準のMenuに置き換えました。iOS 26では、メモアプリなどと同じように、メニューがボタンからLiquid Glassで変形して開閉します（アニメーションはiOS自身が描画）。利用者の実機確認でアニメーションが良好と確認されています。

          メニュー項目は 写真・カメラ・ファイル・動画／新しい会話・会話一覧・モデルと設定。ロック中の項目は「調整中」と表示し、タップで案内を表示します。

          シミュレーターのUIテスト7件中6件が成功。残る1件は＋ボタンの大きさが44ptの想定に対して39ptになっている確認で、動作の不具合ではありません。

          推論処理・同梱ランタイム（native run 38802464425）・E2Bの画像認識経路・E4Bの添付ロックは変更していません。送信後の吹き出しの重なりは次の版で対応予定です。

          AltStoreソースURLは同じです。
          https://raw.githubusercontent.com/taotaohoyo/pocket-gemma-build/main/altstore-source.json
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title 'Pocket Gemma 1.0.23 — ＋ボタンをiOS標準メニューに' --notes-file notes.md \
            candidate/PocketGemma-1.0.23.ipa candidate/PocketGemma-1.0.23.ipa.sha256 candidate/candidate-validation.json
