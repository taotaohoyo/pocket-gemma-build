name: Temporary check of the TestFlight signing scripts (no secrets)
# Temporary: signs the unsigned archive from run 39646080065 ad hoc with a
# made-up team ID, the way the upload job will, and runs the entitlement
# check on it. Nothing is exported or uploaded. Removed before merging.
on:
  push:
    branches: [claude/project-thread-48a0re]
    paths: [.github/workflows/testflight-selftest.yml]
permissions:
  contents: read
  actions: read
jobs:
  selftest:
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      TEAM_ID: ABCDE12345
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/testflight
      - uses: actions/download-artifact@v4
        with:
          name: PocketGemma-TestFlight-Archive
          run-id: 39646080065
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/archive
      - name: Check and extract the archive
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/archive"
          echo "d88d3e17168fc1599bbf6793a305060c58f087c2d40cf63201d19a4fa302efed  PocketGemma.xcarchive.zip" | shasum -a 256 -c -
          ditto -x -k PocketGemma.xcarchive.zip .
      - name: Sign ad hoc with eva+iml (runs the ad hoc check)
        run: bash .github/testflight/sign-archive.sh "$RUNNER_TEMP/archive/PocketGemma.xcarchive" eva+iml
      - name: Show what each target was signed with
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/archive/PocketGemma.xcarchive/Products/Applications/PocketGemma.app"
          for bundle in "$app" "$app"/PlugIns/*.appex; do
            echo "--- ${bundle##*/}"
            codesign -d --entitlements - --xml "$bundle" 2>/dev/null | plutil -p -
          done
      - name: The check fails when the entitlements differ from the choice
        run: |
          set -uo pipefail
          app="$RUNNER_TEMP/archive/PocketGemma.xcarchive/Products/Applications/PocketGemma.app"
          for wrong in none eva iml; do
            if python3 .github/testflight/check-export.py "$app" --memory "$wrong" --adhoc > "$RUNNER_TEMP/wrong.txt"; then
              echo "unexpected pass with --memory $wrong"; cat "$RUNNER_TEMP/wrong.txt"; exit 1
            fi
            grep NG "$RUNNER_TEMP/wrong.txt"
          done
      - name: The check reads an IPA too
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/ipa"
          mkdir -p "$work/Payload"
          ditto "$RUNNER_TEMP/archive/PocketGemma.xcarchive/Products/Applications/PocketGemma.app" "$work/Payload/PocketGemma.app"
          (cd "$work" && ditto -c -k --keepParent Payload check.ipa)
          python3 .github/testflight/check-export.py "$work/check.ipa" --memory eva+iml --adhoc
      - name: Sign again with iml only and none
        run: |
          set -euo pipefail
          bash .github/testflight/sign-archive.sh "$RUNNER_TEMP/archive/PocketGemma.xcarchive" iml
          bash .github/testflight/sign-archive.sh "$RUNNER_TEMP/archive/PocketGemma.xcarchive" none
      - if: always()
        run: rm -rf "$RUNNER_TEMP/archive" "$RUNNER_TEMP/ipa"
