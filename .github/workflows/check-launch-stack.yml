name: Check the main thread's stack at launch
# 1.1.0 (238) crashed at launch on the phone (main thread out of its 1 MB of
# stack while the composer's types were built). Builds each given commit's
# UI preview as Release and prints how deep the main thread went while the
# chat opened (scripts/check-launch-stack.sh, Preview/StackProbe.swift).
on:
  workflow_dispatch:
    inputs:
      refs:
        description: JSON list of commits or branches to measure, side by side, e.g. ["abc123", "def456"]
        required: true
      limit_kb:
        description: The deepest allowed, in KB (the phone has 1024)
        required: false
        default: '640'
permissions:
  contents: read
jobs:
  stack:
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(inputs.refs) }}
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
      - run: unzip -o PocketGemma-source.zip
      - run: brew install xcodegen
      - name: Measure the launch
        timeout-minutes: 30
        env:
          REF: ${{ matrix.ref }}
          LIMIT_KB: ${{ inputs.limit_kb }}
        run: |
          set -euo pipefail
          echo "STACK-REF $REF $(git rev-parse HEAD)"
          bash scripts/check-launch-stack.sh "$LIMIT_KB"
