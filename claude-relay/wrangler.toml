# Fielua's relay to the Claude API (Cloudflare Workers).
# The API key and the admin key are Worker secrets, set in the Cloudflare
# dashboard (Workers & Pages > fielua-claude > Settings > Variables and
# Secrets): ANTHROPIC_API_KEY and ADMIN_TOKEN. Never put them here, in
# GitHub, or in the app.
name = "fielua-claude"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

# Who may use the relay (the developer, invited friends), their invites,
# and the relay's switches, in one SQLite-backed Durable Object: changes
# take effect at once, everywhere (a revoked friend is refused on the next
# request). Durable Objects with SQLite storage are on the Workers Free plan.
[[durable_objects.bindings]]
name = "REGISTRY"
class_name = "Registry"

# Each reply of /v1/replies (Fielua for the web) in an object of its own,
# which goes on when Safari drops the page's connection in the background,
# and keeps the reply in memory only (never in its storage) until the page
# has it, 10 minutes after it ended at the latest (src/reply.ts). SQLite-
# backed because that is what the free plan offers; nothing is stored.
[[durable_objects.bindings]]
name = "REPLY"
class_name = "Reply"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Registry"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Reply"]

# Not secret. Changed here and deployed again.
# CLAUDE_MODEL: the model a chat gets when the app names none (the app
# chooses from the catalog in src/claude.ts). CLAUDE_MAX_TOKENS: the most
# one reply may be at any reasoning level (低 16,000, 中 32,000, 高 and
# 超高 64,000 tokens, never above this).
[vars]
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_MAX_TOKENS = "64000"
# Fielua for the web (https://suelira.com/chat/): the only pages that may
# call the relay from a browser (CORS), and the domain its passkeys belong
# to. Web sessions work only from these origins. Empty turns the web off.
WEB_ORIGINS = "https://suelira.com,https://www.suelira.com"
WEB_RP_ID = "suelira.com"

# No request logs: conversations and keys never reach Cloudflare's logs.
[observability]
enabled = false
