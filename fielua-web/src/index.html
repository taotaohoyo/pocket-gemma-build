<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF7F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fielua">
<meta name="format-detection" content="telephone=no">
<title>Fielua</title>
<link rel="icon" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="__CSS__">
<script type="module" src="__JS__"></script>
</head>
<body>
<noscript><p class="noscript">Fielua を使うには JavaScript をオンにしてください。</p></noscript>

<!-- Signed in already: the flower, until the relay has answered -->
<div id="splash" class="splash" aria-hidden="true" hidden><img src="assets/flower.png" alt="" width="60" height="59"></div>

<!-- Sign in: a passkey, or an invite, or the developer's first setup -->
<main id="login" class="login" hidden>
  <div class="login-inner">
    <img class="login-flower" src="assets/flower.png" alt="" width="132" height="129">
    <h1 class="wordmark">Fielua</h1>
    <section id="login-main" class="login-panel">
      <button type="button" id="login-passkey" class="primary">パスキーでログイン</button>
      <div class="login-links">
        <button type="button" class="text" id="show-invite">招待コードで登録</button>
        <button type="button" class="text" id="show-setup">開発者の初期設定</button>
      </div>
    </section>
    <section id="login-invite" class="login-panel" hidden>
      <h2>招待コードで登録</h2>
      <label class="field"><span>招待コード</span>
        <input id="invite-code" type="text" enterkeyhint="go" inputmode="latin" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="40">
      </label>
      <button type="button" id="invite-register" class="primary">パスキーを作って登録</button>
      <button type="button" class="text back">戻る</button>
    </section>
    <section id="login-setup" class="login-panel" hidden>
      <h2>開発者の初期設定</h2>
      <details class="make-key">
        <summary>管理キーを作る</summary>
        <button type="button" id="make-admin-key" class="secondary">管理キーを作ってコピー</button>
        <output id="made-admin-key" class="made-key" hidden></output>
      </details>
      <label class="field"><span>管理キー（ADMIN_TOKEN）</span>
        <input id="setup-admin-key" type="password" enterkeyhint="go" autocomplete="off" spellcheck="false">
      </label>
      <label class="field"><span>名前</span>
        <input id="setup-name" type="text" enterkeyhint="go" autocomplete="off" maxlength="40">
      </label>
      <button type="button" id="setup-register" class="primary">パスキーを作って登録</button>
      <button type="button" class="text back">戻る</button>
    </section>
    <p id="login-error" class="error-text" role="alert" hidden></p>
  </div>
</main>

<!-- The chat -->
<div id="chat" class="chat" hidden>
  <!-- 会話一覧: under the chat on a phone (the chat slides aside), beside it on a wide screen (the iPhone app's history) -->
  <div id="history" class="history" role="complementary" aria-labelledby="history-title" inert>
    <h2 id="history-title" class="visually-hidden">会話一覧</h2>
    <div class="history-head">
      <div class="history-lockup" id="history-lockup">
        <img src="assets/flower.png" alt="" width="28" height="28">
        <span class="history-wordmark">Fielua</span>
      </div>
      <div class="history-search" id="history-search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/></svg>
        <input type="search" id="history-query" placeholder="会話を検索" aria-label="会話を検索" enterkeyhint="search" autocomplete="off" spellcheck="false">
      </div>
      <button type="button" id="history-search-button" class="glass-circle" aria-label="会話を検索" aria-controls="history-search" aria-expanded="false">
        <svg class="magnifier" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 4.5 4.5"/></svg>
        <svg class="close-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg>
      </button>
    </div>
    <div class="history-scroll" id="history-scroll">
      <ul id="history-list" class="history-list" aria-labelledby="history-title"></ul>
      <p id="history-empty" class="history-empty" hidden></p>
    </div>
    <div class="history-foot">
      <button type="button" id="history-new" class="history-new" aria-label="新しいチャット">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V13"/><path d="M17.6 3.9a1.9 1.9 0 0 1 2.7 2.7L12.6 14.3l-3.4.7.7-3.4Z"/></svg>
        <span>チャット</span>
      </button>
      <button type="button" id="history-settings" class="glass-circle big" aria-label="設定を開く" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4.9a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.4A7.5 7.5 0 0 0 7 6.4l-2.4-.9-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.4h4l.4-2.4a7.5 7.5 0 0 0 2.6-1.5l2.4.9 2-3.4Z"/></svg>
      </button>
    </div>
    <div id="history-menu" class="row-menu" role="menu" aria-label="会話" hidden>
      <button type="button" role="menuitem" id="history-delete" class="danger"><span>削除</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l.8 12.5h8.4L17 7"/><path d="M10.5 11v5M13.5 11v5"/></svg></button>
    </div>
  </div>

  <div id="chat-panel" class="chat-panel">
  <header class="topbar">
    <button type="button" id="history-button" class="icon-button history-button" aria-label="会話一覧を開く" aria-controls="history" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 7.9h16.8M3.6 16.1h9.8"/></svg>
    </button>
    <button type="button" id="model-button" class="model-button" aria-haspopup="dialog" aria-label="モデルと推論レベル">
      <span class="model-line"><svg class="cloud" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18.5h10.2a4 4 0 0 0 .5-8A5.5 5.5 0 0 0 7.1 9a4.75 4.75 0 0 0-.1 9.5Z"/></svg><span id="model-name">Claude</span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></span>
      <span id="model-sub" class="model-sub"></span>
    </button>
    <button type="button" id="settings-button" class="icon-button" aria-haspopup="dialog" aria-label="設定">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 19.5c1.2-3.2 3.8-5 7-5s5.8 1.8 7 5"/></svg>
    </button>
  </header>

  <main id="scroller" class="scroller" tabindex="-1">
    <div id="thread" class="thread" aria-live="off">
      <div id="empty" class="empty">
        <img class="empty-flower" src="assets/flower.png" alt="" width="60" height="59">
        <p id="empty-line" class="empty-line"></p>
      </div>
      <div id="messages" class="messages"></div>
    </div>
  </main>

  <footer class="composer-area">
    <button type="button" id="jump" class="jump" aria-label="いちばん下へ" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v13M6.5 12.5 12 18l5.5-5.5"/></svg>
    </button>
    <p id="banner" class="banner" role="status" hidden></p>
    <div id="tray" class="tray" aria-label="添付" hidden></div>
    <p id="tray-status" class="tray-status" role="status" hidden>添付を読み込んでいます…</p>
    <form id="composer" class="composer" autocomplete="off">
      <button type="button" id="attach" class="attach" aria-haspopup="menu" aria-expanded="false" aria-controls="attach-menu" aria-label="写真・動画・ファイルを添付">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
      </button>
      <div id="attach-menu" class="attach-menu" role="menu" aria-label="添付" hidden>
        <button type="button" role="menuitem" data-pick="photos"><span>写真</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5.5h12a2.5 2.5 0 0 1 2.5 2.5v8A2.5 2.5 0 0 1 18 18.5H6A2.5 2.5 0 0 1 3.5 16V8A2.5 2.5 0 0 1 6 5.5Z"/><path d="m4 16.5 4.5-4.5 3.5 3.5 2.5-2.5 5.5 5.5"/><path d="M15.5 9.5h.01"/></svg></button>
        <button type="button" role="menuitem" data-pick="files"><span>ファイル</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h3.8l2 2h7.2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/></svg></button>
        <button type="button" role="menuitem" data-pick="videos"><span>動画</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 6.5h8a2.5 2.5 0 0 1 2.5 2.5v6a2.5 2.5 0 0 1-2.5 2.5h-8A2.5 2.5 0 0 1 3 15V9a2.5 2.5 0 0 1 2.5-2.5Z"/><path d="m16 10.5 5-3v9l-5-3"/></svg></button>
        <div id="attach-menu-gap" class="menu-gap" role="separator" hidden></div>
        <button type="button" role="menuitemcheckbox" aria-checked="false" data-tool="webSearch" hidden><svg class="menu-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4 4 9-9"/></svg><span>ウェブ検索</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 0 0 17a8.5 8.5 0 0 0 0-17Z"/><path d="M3.5 12h17"/><path d="M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5c-2.3-2.4-3.4-5.2-3.4-8.5s1.1-6.1 3.4-8.5Z"/></svg></button>
        <button type="button" role="menuitemcheckbox" aria-checked="false" data-tool="files" hidden><svg class="menu-check" viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4 4 9-9"/></svg><span>ファイル作成</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3.5h6.5L18 8v12.5H7Z"/><path d="M13.5 3.5V8H18"/><path d="M12.5 11v6M9.5 14h6"/></svg></button>
        <div class="menu-gap" role="separator"></div>
        <button type="button" role="menuitem" id="menu-new-chat"><span>新しいチャット</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4.5H6.5a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V13"/><path d="M17.6 3.9a1.9 1.9 0 0 1 2.7 2.7L12.6 14.3l-3.4.7.7-3.4Z"/></svg></button>
      </div>
      <div id="tool-pills" class="tool-pills"></div>
      <input type="file" id="pick-photos" multiple hidden>
      <input type="file" id="pick-files" multiple hidden>
      <input type="file" id="pick-videos" multiple hidden>
      <button type="button" id="credit" class="credit" aria-haspopup="dialog" hidden>
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle class="track" cx="18" cy="18" r="15"/><circle id="credit-arc" class="arc" cx="18" cy="18" r="15"/></svg>
        <span id="credit-text" class="credit-text"></span>
      </button>
      <textarea id="input" rows="1" placeholder="メッセージ" aria-label="メッセージ" enterkeyhint="send"></textarea>
      <button type="submit" id="send" class="send" aria-label="送信" disabled>
        <svg class="up" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20V4.5M5 11.5l7-7 7 7"/></svg>
        <svg class="stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="6.5" width="11" height="11" rx="2.5"/></svg>
      </button>
    </form>
    <p class="disclosure">Anthropic の AI（Claude）が答えます。誤りを含むことがあります。</p>
  </footer>
  </div>
  <button type="button" id="history-close" class="history-close" aria-label="会話に戻る" tabindex="-1" hidden></button>
</div>

<!-- Model and reasoning level -->
<dialog id="model-sheet" class="sheet" aria-labelledby="model-sheet-title">
  <div class="sheet-head">
    <h2 id="model-sheet-title">モデル</h2>
    <button type="button" class="glass-circle" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="sheet-body">
    <p class="section-label">外部AI · インターネット経由</p>
    <div id="model-list" class="choice-list" role="radiogroup" aria-label="モデル"></div>
    <p class="section-label">推論レベル</p>
    <div id="effort-list" class="choice-list" role="radiogroup" aria-label="推論レベル"></div>
  </div>
</dialog>

<!-- Settings: account, what is sent, and the developer's tools -->
<dialog id="settings-sheet" class="sheet" aria-labelledby="settings-title">
  <div class="sheet-head">
    <h2 id="settings-title">設定</h2>
    <button type="button" class="glass-circle" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="sheet-body" id="settings-body"></div>
</dialog>

<!-- The credit left -->
<dialog id="credit-sheet" class="sheet small" aria-labelledby="credit-title">
  <div class="sheet-head">
    <h2 id="credit-title">クレジットの残り</h2>
    <button type="button" class="glass-circle" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div class="sheet-body" id="credit-body"></div>
</dialog>

<!-- A sent photo or video, larger -->
<dialog id="viewer" class="sheet viewer" aria-labelledby="viewer-title">
  <div class="sheet-head">
    <h2 id="viewer-title"></h2>
    <button type="button" class="glass-circle" data-close aria-label="閉じる"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
  </div>
  <div id="viewer-body" class="viewer-body"></div>
</dialog>

<!-- Confirmations -->
<dialog id="confirm" class="alert" aria-labelledby="confirm-title">
  <h2 id="confirm-title"></h2>
  <div id="confirm-body"></div>
  <div class="alert-buttons">
    <button type="button" class="secondary" id="confirm-cancel">キャンセル</button>
    <button type="button" class="primary" id="confirm-ok">OK</button>
  </div>
</dialog>

<p id="toast" class="toast" role="status" hidden></p>
<p id="announce" class="visually-hidden" role="status"></p>
</body>
</html>
